name: Publish APK downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: amc-release-downloads
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: '1.2.0'
      TAG: v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version
        run: |
          grep -q 'versionName = "1.2.0"' android/app/build.gradle.kts
      - name: Bridge tests
        run: |
          python -m pip install -r termux-bridge/requirements.txt
          python -m unittest discover -s termux-bridge -p 'test_*.py' -v
          for script in termux-bridge/setup.sh termux-bridge/amc termux-bridge/local_model_manager.sh; do
            bash -n "$script"
          done
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AMC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AMC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AMC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AMC_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amc-release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured. Publishing debug downloads only; see docs/RELEASING.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          AMC_KEYSTORE_FILE: ${{ runner.temp }}/amc-release.jks
          AMC_KEYSTORE_PASSWORD: ${{ secrets.AMC_KEYSTORE_PASSWORD }}
          AMC_KEY_ALIAS: ${{ secrets.AMC_KEY_ALIAS }}
          AMC_KEY_PASSWORD: ${{ secrets.AMC_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Verify signatures and package downloads
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.ready }}
        run: |
          mkdir -p dist
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/AMC-$VERSION-debug.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/AMC-$VERSION-debug.apk"
          (cd dist && zip "AMC-$VERSION-debug.zip" "AMC-$VERSION-debug.apk")
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/AMC-$VERSION-release.apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "dist/AMC-$VERSION-release.apk"
            if "$BUILD_TOOLS/aapt" dump badging "dist/AMC-$VERSION-release.apk" | grep -q 'application-debuggable'; then
              echo "Release APK is unexpectedly debuggable." >&2
              exit 1
            fi
            (cd dist && zip "AMC-$VERSION-release.zip" "AMC-$VERSION-release.apk")
          fi
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS.txt)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMC-1.2.0-downloads
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.ready }}
        run: |
          cp docs/releases/v1.2.0.md "$RUNNER_TEMP/release-notes.md"
          printf '\nBuilt from commit: %s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          if [[ "$SIGNED_RELEASE" != "true" ]]; then
            printf '\n**Debug preview:** the debug APK and ZIP are available. Signed release downloads are pending private signing-key configuration. Do not use older release assets as substitutes for this version.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$TAG" --json targetCommitish,isPrerelease,isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            TARGET="$(jq -r .targetCommitish "$RUNNER_TEMP/existing-release.json")"
            [[ "$TARGET" == "$GITHUB_SHA" ]] || { echo "Release points to another commit; refusing to overwrite it."; exit 1; }
            if [[ "$SIGNED_RELEASE" != "true" && "$(jq -r .isPrerelease "$RUNNER_TEMP/existing-release.json")" == "false" && "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" == "false" ]]; then
              echo "Refusing to downgrade an existing signed release."
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AMC $TAG - English edition and security fixes" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release upload "$TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --clobber
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$TAG" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/amc-release.jks"
