name: AMC checks

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Bridge security and process integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r termux-bridge/requirements.txt
      - run: python -m unittest discover -s termux-bridge -p 'test_*.py' -v
      - run: bash -n termux-bridge/setup.sh termux-bridge/amc termux-bridge/local_model_manager.sh

  test-and-build:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aimovix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
