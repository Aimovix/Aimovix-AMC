name: AMC checks

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Bridge security and process integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r termux-bridge/requirements.txt
      - run: python -m unittest discover -s termux-bridge -p 'test_*.py' -v
      - run: bash -n termux-bridge/setup.sh termux-bridge/amc termux-bridge/local_model_manager.sh
      - name: Multi-tier E2E and adversarial test suite
        run: python tests/e2e/runner.py --all

  model-catalog:
    name: Local model catalog (Hugging Face check)
    runs-on: ubuntu-latest
    # Fills missing SHA-256 checksums from the Hub on feature branches and commits them back.
    # On main and in pull requests it only checks (any mismatch fails the run).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill missing checksums (feature branches)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          python scripts/verify_model_catalog.py --write
          if ! git diff --quiet -- android/app/src/main/assets/model_catalog.json termux-bridge/model_catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/src/main/assets/model_catalog.json termux-bridge/model_catalog.json
            git commit -m "chore(catalog): fill model checksums from Hugging Face"
            git push
          fi
      - name: Check the catalog against the Hub
        run: python scripts/verify_model_catalog.py

  test-and-build:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aimovix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
