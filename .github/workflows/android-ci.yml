name: Aimovix-AMC CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Unit Tests & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          build-root-directory: android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Run Unit Tests
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest --no-daemon || gradle testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aimovix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
